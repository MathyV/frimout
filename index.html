<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Frimout: Journey to the Stars</title>
        <meta name="description" content="A browser platform game paying tribute to Dirk Frimout, the first Belgian in space (STS-45, 1992)." />
        <meta name="theme-color" content="#02030a" />
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <main class="stage">
            <canvas id="game" width="480" height="270" aria-label="Frimout: Journey to the Stars game"></canvas>
            <div class="touch" aria-hidden="true">
                <div class="touch-group">
                    <button type="button" data-action="left">&#9664;</button>
                    <button type="button" data-action="right">&#9654;</button>
                </div>
                <div class="touch-group">
                    <button type="button" class="small" data-action="pause">II</button>
                    <button type="button" class="jump" data-action="jump">&#9650;</button>
                </div>
            </div>
        </main>
        <noscript>This game needs JavaScript.</noscript>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
